name: Touch Pinball APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: touch-pinball-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ANDROID_NDK: /usr/local/lib/android/sdk/ndk/29.0.14206865
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/29.0.14206865
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/29.0.14206865
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bison autoconf automake libtool nasm libx11-dev libgl1-mesa-dev libglu1-mesa-dev
          sdkmanager 'platforms;android-37' 'build-tools;36.0.0' 'ndk;29.0.14206865'
          python3 -m pip install --user --break-system-packages 'cmake>=4.0,<5'
      - name: Prepare pinned upstream and Touch source
        run: python3 scripts/prepare.py
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            engine/external
          key: touch-android-${{ runner.os }}-${{ hashFiles('scripts/prepare.py') }}
          restore-keys: touch-android-${{ runner.os }}-
      - name: Compile Android UI and run downloader tests
        working-directory: engine/apps/android
        run: ./gradlew testMobileDebugUnitTest --stacktrace
      - name: Build native dependencies
        working-directory: engine
        run: BUILD_TYPE=Release ./platforms/android-arm64-v8a/external.sh
      - name: Build VPX native player
        working-directory: engine
        run: |
          cmake -DPLATFORM=android -DARCH=arm64-v8a -DCMAKE_BUILD_TYPE=Release -B build/android-arm64-v8a
          cmake --build build/android-arm64-v8a --parallel 4
          test -s build/android-arm64-v8a/libvpinball.so
      - name: Restore stable personal development signing key
        run: |
          mkdir -p ~/.android
          base64 --decode touch/development-keystore.b64 > ~/.android/debug.keystore
      - name: Build installable personal APK
        working-directory: engine/apps/android
        run: ./gradlew assembleMobileDebug -PversionName=1.0.0.${{ github.run_number }} --stacktrace
      - name: Verify and stage APK and source
        run: |
          mkdir -p dist
          cp engine/apps/android/app/build/outputs/apk/mobile/debug/*.apk dist/Touch-Pinball-1.0.${{ github.run_number }}.apk
          unzip -l dist/*.apk | grep 'lib/arm64-v8a/libvpinball.so'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose dist/*.apk
          git -C engine diff --binary > dist/upstream-changes.patch
          cp README.md dist/README.md
          cp engine/LICENSE dist/VPX-LICENSE
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          tar --exclude=.git --exclude=external --exclude=build --exclude=.gradle --exclude=jniLibs --exclude=dist -czf dist/Touch-Pinball-source.tar.gz engine touch scripts .github README.md
      - uses: actions/upload-artifact@v7
        with:
          name: Touch-Pinball-APK-and-source
          path: dist/*
      - name: Publish personal test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create personal-${{ github.run_number }} dist/* --prerelease --title 'Touch Pinball personal build ${{ github.run_number }}' --notes "Android 13+, ARM64. Personal sideload build. Source commit: $GITHUB_SHA. Includes Archive.org catalog, verified downloads, companion installation, and VPX mobile player. No table content is bundled."
